services:
  aioui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aioui
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - DOWNLOAD_DIR=/downloads
    volumes:
      - ${DOWNLOAD_DIR:-./downloads}:/downloads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3
